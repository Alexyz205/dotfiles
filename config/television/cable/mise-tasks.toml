[metadata]
name = "mise-tasks"
description = "A channel to find, inspect and run mise tasks"
requirements = ["mise", "jq"]

[source]
command = [
  { name = "Project", run = "mise tasks ls --json | jq -r '.[] | [.name, (.description // \"\"), .source] | @tsv'" },
  { name = "All",     run = "mise tasks ls --all --json | jq -r '.[] | [.name, (.description // \"\"), .source] | @tsv'" },
]
display = "{split:\\t:0}  {split:\\t:1}"
output = "{split:\\t:0}"

[preview]
command = "mise tasks info '{split:\\t:0}'"

[ui]
layout = "portrait"
[ui.preview_panel]
size = 50
header = "Task: {split:\\t:0}"

[keybindings]
shortcut = "f7"
enter = "actions:run"
ctrl-e = "actions:edit"
ctrl-i = "actions:info"

[actions.run]
description = "Run the selected task"
command = "mise run '{}'"
mode = "execute"

[actions.edit]
description = "Edit the task definition"
command = "mise tasks edit '{}'"
mode = "fork"

[actions.info]
description = "Show task details"
command = "mise tasks info '{}'"
mode = "fork"
