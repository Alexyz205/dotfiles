# ===============================================
# Nix User Configuration
# ===============================================
# Best-practice user-level Nix settings (reads from ~/.config/nix/nix.conf).
# System-level daemon settings (e.g. build-users-group) belong in
# /etc/nix/nix.conf and are NOT handled here.
#
# Last Updated: 2026-08-10

# ===============================================
# Experimental Features
# ===============================================
# Enable the modern nix CLI and flakes (required for NixOS flake configs)
experimental-features = nix-command flakes

# ===============================================
# Substituters (Binary Caches)
# ===============================================
# Official cache first, extra substituters append (add cachix caches as needed)
substituters = https://cache.nixos.org
extra-substituters =
# Example: your personal cache
# extra-substituters = https://<user>.cachix.org
# extra-trusted-public-keys = <user>.cachix.org-1:<key>

# ===============================================
# Performance
# ===============================================
# Use all available CPU cores for local builds
max-jobs = auto

# Let builders use all cores (0 = all available)
cores = 0

# Parallel substitutions
max-substitution-jobs = 16

# ===============================================
# Networking
# ===============================================
# Connection timeout in seconds (0 = no limit)
connect-timeout = 0

# Parallel download connections
http-connections = 25

# Retry downloads up to N times
download-attempts = 5

# ===============================================
# Build Behaviour
# ===============================================
# Keep building other derivations when one fails
keep-going = true

# Fall back to building from source if a binary substitute fails
fallback = true

# Keep outputs and derivations to improve rebuild/traceability
keep-outputs = true
keep-derivations = true

# ===============================================
# Disk Management
# ===============================================
# Hard-link identical store files automatically (saves disk space)
auto-optimise-store = true

# Reserve disk space for the garbage collector
gc-reserved-space = 1073741824

# ===============================================
# Development Experience
# ===============================================
# Silence "Git tree is dirty" warnings when iterating on NixOS flakes
warn-dirty = false
